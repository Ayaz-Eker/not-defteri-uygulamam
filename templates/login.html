<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>programcının günlüğü</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <header class="header">
        <img src="../static/img/logo.svg" alt="logo" width="30" height="30">
        <ul class="main-list">
            <li class="list__item">
                <button id="dark-mode-toggle" class="dark-mode-btn">🌙</button>
            </li>
        </ul>
      </header>
      <main class="main-login">
        {% block content %}
        <form action="{{ url_for('login') }}" method="POST" class="login">
            <p class="error">{{error}}</p>

            <!-- Ödev #2. Giriş alanları oluştur -->
            <label for="email">E-posta</label>
            <input type="email" name="email" id="email" placeholder="E-posta adresinizi girin" required>

            <label for="password">Şifre</label>
            <input type="password" name="password" id="password" placeholder="Parolanızı girin" required>

            <!--  -->
                <button class="form__button">Giriş</button>
                <a href="/reg" class="form__button reg__link">Kayıt</a>
        </form>
        {% endblock %}
      </main>
      <footer class="footer">
        <p class="footer-text">powered by ayaz eker</p>
      </footer>
      <script>
        const darkModeToggle = document.getElementById('dark-mode-toggle');
        const body = document.body;

        // Check for saved theme preference or default to light mode
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
          body.classList.add('dark-mode');
          darkModeToggle.textContent = '☀️';
        } else {
          darkModeToggle.textContent = '🌙';
        }

        darkModeToggle.addEventListener('click', () => {
          body.classList.toggle('dark-mode');
          const theme = body.classList.contains('dark-mode') ? 'dark' : 'light';
          localStorage.setItem('theme', theme);
          darkModeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
        });
      </script>
</body>
</html>
